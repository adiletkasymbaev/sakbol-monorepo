components:
  schemas:
    AlertSignal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sender_user:
          allOf:
          - $ref: '#/components/schemas/SimpleUser'
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
          title: Широта
        longitude:
          type: number
          format: double
          readOnly: true
          title: Долгота
        status:
          allOf:
          - $ref: '#/components/schemas/AlertSignalStatusEnum'
          readOnly: true
          title: Статус
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
      required:
      - created_at
      - id
      - latitude
      - longitude
      - sender_user
      - status
    AlertSignalAnswer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        alert_signal_id:
          type: integer
          readOnly: true
        responder_user:
          allOf:
          - $ref: '#/components/schemas/SimpleUser'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
      required:
      - alert_signal_id
      - created_at
      - id
      - responder_user
    AlertSignalAnswerCreateRequest:
      type: object
      description: |-
        Serializer для ответа на Alert-сигнал.
        Вход: { alert_signal_id }
      properties:
        alert_signal_id:
          type: integer
      required:
      - alert_signal_id
    AlertSignalCreateRequest:
      type: object
      description: |-
        Serializer для создания Alert-сигнала.
        Вход: { latitude, longitude }
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
      - latitude
      - longitude
    AlertSignalStatusEnum:
      enum:
      - pending
      - answered
      - no_answer
      - inactive
      - resolved
      type: string
      description: |-
        * `pending` - pending
        * `answered` - answered
        * `no_answer` - no_answer
        * `inactive` - inactive
        * `resolved` - resolved
    AvatarUpdateRequest:
      type: object
      properties:
        user_id:
          type: integer
        avatar:
          type: string
          format: binary
      required:
      - avatar
      - user_id
    Contact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        from_user:
          allOf:
          - $ref: '#/components/schemas/SimpleUser'
          readOnly: true
        from_profile:
          type: string
          readOnly: true
        to_user:
          allOf:
          - $ref: '#/components/schemas/SimpleUser'
          readOnly: true
        to_profile:
          type: string
          readOnly: true
        is_accepted:
          type: boolean
          readOnly: true
          title: Принята
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
      required:
      - created_at
      - from_profile
      - from_user
      - id
      - is_accepted
      - to_profile
      - to_user
    ContactCreateRequest:
      type: object
      description: |-
        Serializer для создания запроса в контакты по identifier профиля.
        При создании from_user берётся из request.user.
        Вход: { "identifier": "ABC123" }
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - identifier
    ContactLocationItem:
      type: object
      description: |-
        Формат выдачи для места контакта
        { contact_id, first_name, last_name, avatar, latitude, longitude, is_online, last_seen }
      properties:
        contact_id:
          type: integer
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        avatar:
          type: string
          format: uri
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
      required:
      - avatar
      - contact_id
      - first_name
      - last_name
      - latitude
      - longitude
    EmailTokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Geofence:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        children:
          type: array
          items:
            type: integer
        polygon: {}
        arrive_time:
          type: string
          format: time
          nullable: true
        depart_time:
          type: string
          format: time
          nullable: true
        remind_minutes: {}
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - children
      - created_at
      - id
      - polygon
    GeofenceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        children:
          type: array
          items:
            type: integer
        polygon: {}
        arrive_time:
          type: string
          format: time
          nullable: true
        depart_time:
          type: string
          format: time
          nullable: true
        remind_minutes: {}
        is_active:
          type: boolean
      required:
      - children
      - polygon
    Location:
      type: object
      properties:
        user_id:
          type: integer
          readOnly: true
        latitude:
          type: number
          format: double
          nullable: true
          title: Широта
        longitude:
          type: number
          format: double
          nullable: true
          title: Долгота
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
      required:
      - updated_at
      - user_id
    LocationUpdateRequest:
      type: object
      description: |-
        Для обновления координат.
        Принимает:
          - latitude
          - longitude
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
