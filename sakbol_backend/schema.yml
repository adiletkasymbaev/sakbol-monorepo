openapi: 3.0.3
info:
  title: Sakbol API
  version: 1.0.0
  description: Документация API
paths:
  /accounts/login/:
    post:
      operationId: accounts_login_create
      description: |2

        Авторизация пользователя по email и паролю.

        **Входные данные:**
        - `email` (string, required) — email пользователя
        - `password` (string, required) — пароль

        **Выходные данные:**
        - `access` — access token
        - `refresh` — refresh token
        - `user_id` — ID пользователя
        - `email` — email пользователя
        - `role` — роль пользователя
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPairRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh:
                    type: string
                    description: JWT refresh token
                  access:
                    type: string
                    description: JWT access token
                  user_id:
                    type: integer
                    description: ID созданного пользователя
                  email:
                    type: string
                    format: email
                    description: Email пользователя
                  role:
                    type: string
                    description: Роль пользователя
          description: ''
  /accounts/profile/{user_id}/:
    get:
      operationId: accounts_profile_retrieve
      description: Детальная информация о профиле пользователя
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                        format: email
                      first_name:
                        type: string
                      last_name:
                        type: string
                  first_name:
                    type: string
                  last_name:
                    type: string
                  birth_date:
                    type: string
                    format: date
                  city:
                    type: string
                    nullable: true
                  street:
                    type: string
                    nullable: true
                  house_number:
                    type: string
                    nullable: true
                  apartment_number:
                    type: string
                    nullable: true
                  med_info:
                    type: string
                    nullable: true
                  role:
                    type: string
                  is_online:
                    type: boolean
                  last_seen:
                    type: string
                    format: date-time
                    nullable: true
                  identifier:
                    type: string
                    nullable: true
                  avatar:
                    type: string
                    format: uri
                    nullable: true
                  phone_number:
                    type: string
                    nullable: true
          description: ''
  /accounts/profile/avatar/:
    post:
      operationId: accounts_profile_avatar_create
      description: |2

        Обновление аватара пользователя.

        **Входные данные (multipart/form-data):**
        - `user_id` (integer, required) — ID пользователя
        - `avatar` (file, required) — файл аватара

        **Выходные данные:**
        - `id` (integer)
        - `user` (object):
            - `id` (integer)
            - `email` (string)
            - `first_name` (string)
            - `last_name` (string)
        - `avatar` (string, URL до аватара)
        - `created_at`, `updated_at` (string, datetime)
      tags:
      - accounts
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AvatarUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
          description: ''
  /accounts/profile/me/:
    get:
      operationId: accounts_profile_me_retrieve
      description: Детальная информация о профиле пользователя
      tags:
      - accounts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                        format: email
                      first_name:
                        type: string
                      last_name:
                        type: string
                  first_name:
                    type: string
                  last_name:
                    type: string
                  birth_date:
                    type: string
                    format: date
                  city:
                    type: string
                    nullable: true
                  street:
                    type: string
                    nullable: true
                  house_number:
                    type: string
                    nullable: true
                  apartment_number:
                    type: string
                    nullable: true
                  med_info:
                    type: string
                    nullable: true
                  role:
                    type: string
                  is_online:
                    type: boolean
                  last_seen:
                    type: string
                    format: date-time
                    nullable: true
                  identifier:
                    type: string
                    nullable: true
                  avatar:
                    type: string
                    format: uri
                    nullable: true
                  phone_number:
                    type: string
                    nullable: true
          description: ''
  /accounts/refresh/:
    post:
      operationId: accounts_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /accounts/register/:
    post:
      operationId: accounts_register_create
      description: |2

        Регистрация нового пользователя.

        **Входные данные (multipart/json):**
        - `email` (string, required) — email пользователя
        - `password` (string, required) — пароль
        - `first_name` (string, required) — имя
        - `last_name` (string, required) — фамилия
        - `birth_date` (string, required) — дата рождения в формате YYYY-MM-DD
        - `phone_number` (string, required) — телефон в международном формате
        - `city` (string, required)
        - `street` (string, required)
        - `house_number` (string, required)
        - `apartment_number` (string, optional)
        - `med_info` (string, optional)
        - `role` (string, optional) — роль пользователя
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh:
                    type: string
                    description: JWT refresh token
                  access:
                    type: string
                    description: JWT access token
                  user_id:
                    type: integer
                    description: ID созданного пользователя
                  email:
                    type: string
                    format: email
                    description: Email пользователя
          description: ''
  /general/contacts_module/alerts/:
    get:
      operationId: general_contacts_module_alerts_list
      description: Возвращает все Alert-сигналы текущего пользователя.
      summary: Список Alert-сигналов
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Alert Signals
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertSignalList'
          description: ''
    post:
      operationId: general_contacts_module_alerts_create
      description: Создаёт новый Alert-сигнал с координатами.
      summary: Создать Alert-сигнал
      tags:
      - Alert Signals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSignalCreateRequest'
            examples:
              ПримерЗапроса:
                value:
                  latitude: 42.8746
                  longitude: 74.5698
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertSignalCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertSignalCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSignal'
          description: ''
        '400':
          description: Ошибка валидации.
        '401':
          description: Не авторизован.
  /general/contacts_module/alerts/{id}/:
    get:
      operationId: general_contacts_module_alerts_retrieve
      description: CRUD для Alert-сигналов.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - general
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSignal'
          description: ''
    put:
      operationId: general_contacts_module_alerts_update
      description: CRUD для Alert-сигналов.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - general
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSignal'
          description: ''
    patch:
      operationId: general_contacts_module_alerts_partial_update
      description: CRUD для Alert-сигналов.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - general
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSignal'
          description: ''
    delete:
      operationId: general_contacts_module_alerts_destroy
      description: CRUD для Alert-сигналов.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - general
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /general/contacts_module/alerts/{id}/answer/:
    post:
      operationId: general_contacts_module_alerts_answer_create
      description: Создаёт ответ на указанный Alert-сигнал.
      summary: Ответить на Alert-сигнал
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Alert Signals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSignalAnswerCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertSignalAnswerCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertSignalAnswerCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSignalAnswer'
          description: ''
        '400':
          description: Ошибка валидации.
        '401':
          description: Не авторизован.
  /general/contacts_module/alerts/{id}/answers/:
    get:
      operationId: general_contacts_module_alerts_answers_list
      description: Возвращает все ответы на указанный Alert-сигнал.
      summary: Список ответов на Alert-сигнал
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Alert Signals
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertSignalAnswerList'
          description: ''
        '404':
          description: Не найдено.
  /general/contacts_module/contacts/:
    get:
      operationId: general_contacts_module_contacts_list
      description: |-
        Возвращает список Contact, где текущий пользователь является `from_user` или `to_user`.

        Можно фильтровать по статусу принятия.
      summary: Список контактов пользователя
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - accepted
          - pending
        description: 'Фильтр: accepted | pending'
      tags:
      - Contacts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactList'
          description: ''
    post:
      operationId: general_contacts_module_contacts_create
      description: |-
        Создаёт заявку в контакты по `identifier` профиля.
        `from_user` берётся из `request.user`.
      summary: Создать заявку в контакты
      tags:
      - Contacts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreateRequest'
            examples:
              ПримерЗапроса:
                value:
                  identifier: ABC123
                summary: Пример запроса
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
        '400':
          description: 'Валидация: профиль не найден / нельзя себя / запрос уже существует.'
        '401':
          description: Не авторизован.
  /general/contacts_module/contacts/{id}/:
    get:
      operationId: general_contacts_module_contacts_retrieve
      description: Доступно только участникам контакта (from_user/to_user).
      summary: Получить контакт по id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Контакт.
        required: true
      tags:
      - Contacts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
        '403':
          description: Нет доступа к этому контакту.
        '404':
          description: Не найдено.
    delete:
      operationId: general_contacts_module_contacts_destroy
      description: Удалить может участник контакта (from_user/to_user) или staff.
      summary: Удалить контакт/заявку
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Контакт.
        required: true
      tags:
      - Contacts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: Удалено.
        '403':
          description: Нет прав удалять этот контакт.
        '404':
          description: Не найдено.
  /general/contacts_module/contacts/{id}/accept/:
    post:
      operationId: general_contacts_module_contacts_accept_create
      description: |-
        Принять заявку может только получатель (`to_user`).
        Если уже принято — вернёт текущий объект.
      summary: Принять заявку в контакты
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Контакт.
        required: true
      tags:
      - Contacts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
        '403':
          description: Только получатель запроса может принять контакт.
        '404':
          description: Не найдено.
  /general/contacts_module/contacts/incoming/:
    get:
      operationId: general_contacts_module_contacts_incoming_list
      description: |-
        Возвращает список заявок, которые другие пользователи отправили текущему пользователю.
        Только pending: to_user = текущий пользователь и is_accepted = false.
      summary: Входящие заявки в контакты
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Contacts
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactList'
          description: ''
        '401':
          description: Не авторизован.
  /general/contacts_module/geofences/:
    get:
      operationId: general_contacts_module_geofences_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - general
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGeofenceList'
          description: ''
    post:
      operationId: general_contacts_module_geofences_create
      tags:
      - general
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeofenceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GeofenceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GeofenceRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geofence'
          description: ''
  /general/contacts_module/geofences/{id}/:
    get:
      operationId: general_contacts_module_geofences_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - general
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geofence'
          description: ''
    put:
      operationId: general_contacts_module_geofences_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - general
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeofenceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GeofenceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GeofenceRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geofence'
          description: ''
    patch:
      operationId: general_contacts_module_geofences_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - general
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGeofenceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGeofenceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGeofenceRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Geofence'
          description: ''
    delete:
      operationId: general_contacts_module_geofences_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - general
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /general/contacts_module/geofences/{id}/check-outside/:
    get:
      operationId: general_contacts_module_geofences_check_outside_retrieve
      description: Проверяет текущее местоположение указанного ребёнка относительно
        данной зоны. Если ребёнок за пределами — отправляет push всем его устройствам
        родителя.
      summary: Проверить, находится ли ребёнок вне зоны
      parameters:
      - in: query
        name: child_id
        schema:
          type: integer
        description: ID пользователя-ребёнка
        required: true
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Geofences
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: '{ outside, child_id, geofence_id, latitude, longitude }'
        '400':
          description: child_id не указан или ребёнок не в этой зоне.
        '403':
          description: Нет прав.
        '404':
          description: Не найдено.
  /general/contacts_module/sos/:
