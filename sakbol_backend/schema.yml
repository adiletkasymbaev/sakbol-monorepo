          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          title: Широта центра
        center_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          title: Долгота центра
        is_active:
          type: boolean
          title: Активна
      required:
      - center_lat
      - center_lng
      - name
      - polygon
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
